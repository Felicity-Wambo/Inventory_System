<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Inventory System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe
                );

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;

            background: white;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 20px 60px
                rgba(30, 64, 175, .12);
        }

        .icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 24px;

            background: #eff6ff;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        h1 {
            text-align: center;

            font-size: 27px;

            color: #111827;

            margin-bottom: 10px;
        }

        .description {
            text-align: center;

            color: #6b7280;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        label {
            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #374151;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            height: 50px;

            padding: 0 15px;

            border:
                1.5px solid #e5e7eb;

            border-radius: 10px;

            font-size: 14px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,.10);
        }

        button {
            width: 100%;

            height: 50px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 14px;

            font-weight: 650;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 20px;

            padding: 14px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;
        }

        .success {
            background: #ecfdf5;

            color: #047857;

            border:
                1px solid #a7f3d0;
        }

        .error {
            background: #fef2f2;

            color: #b91c1c;

            border:
                1px solid #fecaca;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 25px;

            color: #2563eb;

            font-size: 13px;

            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">
        🔐
    </div>

    <h1>
        Forgot your password?
    </h1>

    <p class="description">
        Enter the email address associated with
        your account and we'll send you a secure
        password reset link.
    </p>


    <form id="forgotForm">

        <label for="email">
            Email address
        </label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
        >

        <button
            type="submit"
            id="submitButton"
        >
            Send Reset Link
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="/"
        class="back"
    >
        ← Back to Login
    </a>

</div>


<script>

const form =
    document.getElementById("forgotForm");

const email =
    document.getElementById("email");

const button =
    document.getElementById("submitButton");

const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        message.style.display = "none";

        button.disabled = true;

        button.textContent =
            "Sending...";


        try {

            const response =
                await fetch(
                    "/api/auth/forgot-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email.value.trim()
                        })
                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                message.className =
                    "message success";

                message.textContent =
                    data.message;

                message.style.display =
                    "block";

                form.reset();

            } else {

                message.className =
                    "message error";

                message.textContent =
                    data.detail ||
                    "Unable to send reset email.";

                message.style.display =
                    "block";
            }


        } catch(error) {

            message.className =
                "message error";

            message.textContent =
                "Unable to connect to the server.";

            message.style.display =
                "block";

        } finally {

            button.disabled = false;

            button.textContent =
                "Send Reset Link";

        }

    }
);

</script>

</body>
</html>
