<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Inventory Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f5f7fb);
            color: #1f2937;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-icon {
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            border-radius: 16px;
            background: #e8f0ff;
            color: #2457a7;
            font-size: 30px;
        }

        .login-header h1 {
            margin-bottom: 8px;
            color: #173b72;
            font-size: 25px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2864b4;
            box-shadow: 0 0 0 3px rgba(40, 100, 180, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #2457a7;
            font-weight: 600;
            cursor: pointer;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            font-size: 13px;
        }

        .remember-option {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember-option input {
            cursor: pointer;
        }

        .form-options a {
            color: #2457a7;
            text-decoration: none;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2457a7;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #173f80;
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .error-message,
        .success-message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
        }

        .login-footer {
            margin-top: 25px;
            text-align: center;
            color: #6b7280;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }

            .login-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">

        <header class="login-header">
            <div class="login-icon" aria-hidden="true">📦</div>
            <h1>Welcome Back</h1>
            <p>Sign in to your Inventory Management System</p>
        </header>

        <div
            id="errorMessage"
            class="error-message"
            role="alert"
            aria-live="polite">
        </div>

        <div
            id="successMessage"
            class="success-message"
            role="status"
            aria-live="polite">
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword">
                        Show
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-option" for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    Remember me
                </label>

                <a href="/forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="login-button" id="loginButton">
                Sign In
            </button>
        </form>

        <footer class="login-footer">
            Inventory Management System &copy; 2026
        </footer>

    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");
        const rememberCheckbox = document.getElementById("remember");
        const passwordInput = document.getElementById("password");
        const togglePasswordButton = document.getElementById("togglePassword");

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
            successMessage.style.display = "none";
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = "block";
            errorMessage.style.display = "none";
        }

        togglePasswordButton.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";
            togglePasswordButton.textContent = isPassword ? "Hide" : "Show";
        });

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            errorMessage.style.display = "none";
            successMessage.style.display = "none";

            const username = document.getElementById("username").value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError("Please enter your username and password.");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {
                /*
                 * STEP 1: Authenticate the user.
                 */
                const formData = new URLSearchParams();
                formData.append("username", username);
                formData.append("password", password);

                const loginResponse = await fetch("/api/auth/token", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData.toString()
                });

                if (!loginResponse.ok) {
                    let message = "Invalid username or password.";

                    try {
                        const errorData = await loginResponse.json();
                        if (errorData.detail) {
                            message = errorData.detail;
                        }
                    } catch (_) {
                        // Keep the default error message.
                    }

                    showError(message);
                    return;
                }

                const loginData = await loginResponse.json();

                if (!loginData.access_token) {
                    showError("Login failed: the server did not return an access token.");
                    return;
                }

                /*
                 * STEP 2: Save the access token.
                 */
                localStorage.setItem("access_token", loginData.access_token);

                if (rememberCheckbox.checked) {
                    localStorage.setItem("rememberLogin", "true");
                } else {
                    localStorage.removeItem("rememberLogin");
                }

                /*
                 * STEP 3: Retrieve the authenticated user's details.
                 */
                const userResponse = await fetch("/api/auth/me", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${loginData.access_token}`
                    }
                });

                if (!userResponse.ok) {
                    localStorage.removeItem("access_token");
                    localStorage.removeItem("rememberLogin");

                    showError(
                        "Your login could not be verified. Please sign in again."
                    );
                    return;
                }

                const user = await userResponse.json();

                /*
                 * STEP 4: Read the user's role.
                 */
                const roleValue = user.role;
                const role = String(
                    typeof roleValue === "object" && roleValue !== null
                        ? roleValue.value
                        : roleValue || ""
                ).toLowerCase();

                /*
                 * STEP 5: Redirect according to the role.
                 */
                showSuccess("Login successful. Redirecting...");

                if (role === "staff") {
                    window.location.replace("/pos");
                } else if (role === "admin" || role === "manager") {
                    window.location.replace("/dashboard");
                } else if (role === "viewer") {
                    window.location.replace("/dashboard");
                } else {
                    localStorage.removeItem("access_token");
                    localStorage.removeItem("rememberLogin");

                    showError(
                        "Your account has an unrecognized role. Contact your administrator."
                    );
                }

            } catch (error) {
                console.error("Login error:", error);

                showError(
                    "Unable to connect to the server. Check that your backend is running and try again."
                );

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Sign In";
            }
        });

        /*
         * Restore the Remember Me checkbox.
         * This does not automatically authenticate the user.
         */
        rememberCheckbox.checked =
            localStorage.getItem("rememberLogin") === "true";
    </script>
</body>
</html>
