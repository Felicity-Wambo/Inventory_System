<!-- app/templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Inventory System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #1e40af; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #6b7280; margin-bottom: 32px; font-size: 14px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: #374151; font-size: 14px; }
        input {
            width: 100%; padding: 12px;
            border: 2px solid #e5e7eb; border-radius: 8px;
            font-size: 14px; margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .error {
            background: #fee2e2; color: #991b1b;
            padding: 12px; border-radius: 8px;
            margin-bottom: 16px; font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>📦 Inventory System</h1>
        <p class="subtitle">Sign in to your account</p>
        <div class="error" id="error"></div>
        <form id="loginForm">
            <label>Username</label>
            <input type="text" id="username" required autofocus>
            <label>Password</label>
            <input type="password" id="password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('error');
            errDiv.style.display = 'none';
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);
            try {
                const res = await fetch('/api/auth/token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: formData
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/dashboard';
                } else {
                    errDiv.textContent = 'Invalid credentials';
                    errDiv.style.display = 'block';
                }
            } catch (err) {
                errDiv.textContent = 'Connection error';
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
